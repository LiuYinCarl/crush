# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Fork release workflow: plain `go build` for macOS/Linux/Windows and a
# GitHub Release with the archives attached. No goreleaser, no signing,
# no external publishers. See FORK.md for the release procedure.

name: fork-release

on:
  push:
    tags:
      - "v*.*.*-historynav.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          GOEXPERIMENT: greenteagc
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          out="crush_${version}_${GOOS}_${GOARCH}"
          bin="crush"
          if [ "$GOOS" = "windows" ]; then bin="crush.exe"; fi
          go build -trimpath \
            -ldflags "-s -w -X github.com/charmbracelet/crush/internal/version.Version=${version}" \
            -o "$bin" .
          mkdir -p "dist/$out"
          mv "$bin" "dist/$out/"
          cp README.md LICENSE.md "dist/$out/"
          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip -r "$out.zip" "$out")
          else
            (cd dist && tar -czf "$out.tar.gz" "$out")
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum *.tar.gz *.zip > checksums.txt
          gh release create "$TAG" --repo "${{ github.repository }}" \
            --prerelease --title "$TAG" \
            --notes "Fork build with the history-navigation patch. See FORK.md." \
            *.tar.gz *.zip checksums.txt
